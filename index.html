<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taustanauhat - Live Soitin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }

        .player-container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .master-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #playAllBtn {
            flex: 1;
            background-color: #2e7d32;
            color: white;
        }
        #playAllBtn:hover { background-color: #388e3c; }

        #stopAllBtn {
            flex: 1;
            background-color: #c62828;
            color: white;
        }
        #stopAllBtn:hover { background-color: #d32f2f; }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 12px 15px;
            border-radius: 8px;
            transition: background 0.2s, border-left 0.2s;
            border-left: 5px solid transparent;
            user-select: none;
        }

        .track-item:hover {
            background: #333;
        }

        .track-item.active {
            background: #2c3e50;
            border-left-color: #3498db;
        }

        .track-item.paused {
            background: #4a382a;
            border-left-color: #e67e22;
        }

        .track-click-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            cursor: pointer;
            margin-right: 10px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .track-status {
            font-size: 0.85rem;
            color: #aaa;
        }

        .track-icon {
            font-size: 1.3rem;
            margin-right: 10px;
        }

        .lyrics-btn {
            background-color: #1565c0;
            color: white;
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            font-weight: normal;
        }
        .lyrics-btn:hover {
            background-color: #1e88e5;
        }

        .settings {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            width: 50px;
            border-radius: 4px;
            text-align: center;
        }

        /* Modaali sanoille */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #1e1e1e;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            color: #fff;
            font-size: 1.4rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }
        .close-btn:hover { color: #fff; }

        .modal-body {
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e0e0e0;
            padding-right: 5px;
        }

        .modal-footer {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
            text-align: right;
        }

        .close-modal-btn {
            background-color: #424242;
            color: white;
            padding: 8px 16px;
        }
        .close-modal-btn:hover { background-color: #616161; }
    </style>
</head>
<body>

    <script>
        // --- SALASANASUOJAUS ---
        const oikeaSalasana = "laulut2026"; 
        
        const syotettySalasana = prompt("Anna sivuston salasana:");
        if (syotettySalasana !== oikeaSalasana) {
            document.body.innerHTML = "<h2 style='text-align:center; color:#ff5252; margin-top:100px;'>Väärä salasana. Päivitä sivu yrittääksesi uudelleen.</h2>";
            throw new Error("Pääsy estetty");
        }
    </script>

    <h1>Laulajan Taustanauhat</h1>
    <div class="subtitle">Kosketa kappaletta soittaaksesi tai katso sanoja napan painikkeesta</div>

    <div class="player-container">
        <div class="master-controls">
            <button id="playAllBtn" onclick="startPlaylist()">Soita lista putkeen</button>
            <button id="stopAllBtn" onclick="stopEverything()">Pysäytä kaikki</button>
        </div>

        <div class="playlist" id="playlist">
            <!-- Kappaleet generoidaan dynaamisesti -->
        </div>

        <div class="settings">
            <label for="pauseTime">Tauko kappaleiden välissä (sek):</label>
            <input type="number" id="pauseTime" value="2" min="0" max="10">
        </div>
    </div>

    <!-- Modal Sanat -ikkunalle -->
    <div id="lyricsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Kappaleen sanat</h2>
                <button class="close-btn" onclick="closeLyrics()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Sanat tulevat tähän -->
            </div>
            <div class="modal-footer">
                <button class="close-modal-btn" onclick="closeLyrics()">Sulje</button>
            </div>
        </div>
    </div>

    <script>
        // Kappalelista, tiedostot ja sanat
        const tracks = [
            { 
                title: "Terapiaa", 
                file: "audio/terapiaa.mp3",
                lyrics: `Terapiaa kaikille 
planeetta kiehuu pohjaa
reseptiin on mennyt
liikaa mausteita

Teoriaa olen täynnä
Kokemus saa silti veltoksi
Ihmiseen on enää 
vaikee uskoa

Olen saanut tarpeekseni
pakokauhusta
En enää tyydytystä saa tässä roolissa
Evoluutiossa nousen tuhat askelmaa
ja tunnustan vihdoin totuuden
kaipaan vapauteen

Terapiaa
Teoriaa mä vaihdan
Kyseenalaistan kaiken
Ihmiseen on enää vaikee uskoa` 
            },
            { 
                title: "Varjo", 
                file: "audio/varjo.mp3",
                lyrics: `Systemaattisesti kaiken penkonut
luvatta sun taskuillas
Epäloogisuuden pois sulkenut
skitsoillut ilman faktoja
Tää operaatio
Ei saisi paljastua
kohteena on rakkaus
Vakoiltu on aina historiassa
valloitus tietää orjuutta

Langennut olen sun varjoksi
Kauneus korruptoi myös enkelin
sul on valtaa hallitsetko sen
vai vietkö valssiin intohimoiseen

on kiusaus saada tietää mistä haaveilet
kasaan johtolangat ja palaset paikoillen
voisinko mä olla se` 
            },
            { 
                title: "Hän säteilee", 
                file: "audio/han_sateilee.mp3",
                lyrics: `Ei hälytyskellot soi
ei summerit huuda 
ei iholla jälkiä nää
physiikka on ok

näkymätön aalto 
pyyhkii yli maan
Vain yksi väreilee väkijoukossa

Sä loistat poissa olollas 
säteleit kaipausta
tunnen kuinka veri kiehuu

Ei suojele temppeli
ei lohduta näytelmä
säteily ylittää sallitun määrän
mä sulan ilman sua..

Hän säteilee` 
            },
            { 
                title: "Taikaa", 
                file: "audio/taikaa.mp3",
                lyrics: `Tuskin tiedät minkälaisen tunnekuohun aikaan saat
Siiven isku perhosen voi pyöremyrskyn aloittaa
luonnonvoimat tanssivat kun
runoilet sun kauniita juttuja
Kuiskaus ja tunnen kuinka mannerlaatat vavahtaa

Jos tämä ei ole taikaa 
herätit mut kuolleista
Olen nähnyt ihmeen
Lazarus on pihalla
riisuit minut kahleista

Ikivanhat kirjoitukset herää henkiin
olen nähnyt enkelin
Pelastit mut helvetistä
Tuskin enää muistin mitä on olla onnellinen` 
            },
            { 
                title: "Kreivin aikaan", 
                file: "audio/Kreivin_aikaan_Karaoke.mp3",
                lyrics: `Katson ja yritän ymmärtää
Eleesi lähettää 
salaisia viestejä
Historia on jättäni jälkensä
niin lämmin tuuli maalaa hymyn kasvoille

Vain pintaa hipaisi
yhteyden sain
Repaleiseen sydämeen
kreivin aikaan
Kai vanhanaikaista on runoilla kauniisti
lausua loitsuja 
mutta ne sai sut kauniiksi

Vihdoin joku on kartalla
Katvealueella
puhuu samaa kieltä
niin kauan etsittiin säveltä
linkkiä väliltä kaukaisen aseman` 
            }
        ];

        let currentAudio = null;
        let currentIndex = -1;
        let isPlayingList = false;
        let timeoutId = null;

        const playlistEl = document.getElementById('playlist');

        function initPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'track-item';
                div.id = `track-${index}`;
                div.innerHTML = `
                    <div class="track-click-area" onclick="handleTrackClick(${index})">
                        <div class="track-info">
                            <span class="track-title">${track.title}</span>
                            <span class="track-status" id="status-${index}">Valmiina</span>
                        </div>
                        <span class="track-icon" id="icon-${index}">▶</span>
                    </div>
                    <button class="lyrics-btn" onclick="openLyrics(${index})">Sanat</button>
                `;
                playlistEl.appendChild(div);
            });
        }

        function handleTrackClick(index) {
            isPlayingList = false;
            clearTimeout(timeoutId);

            if (currentIndex === index && currentAudio) {
                if (!currentAudio.paused) {
                    currentAudio.pause();
                    updateUI(index, 'paused');
                } else {
                    currentAudio.play();
                    updateUI(index, 'playing');
                }
            } else {
                stopEverything();
                playTrack(index, false);
            }
        }

        function playTrack(index, autoContinue = false) {
            currentIndex = index;
            currentAudio = new Audio(tracks[index].file);

            updateUI(index, 'playing');

            currentAudio.play().catch(error => {
                alert(`Virhe tiedoston toistossa: ${tracks[index].file}\nTarkista, että äänitiedosto löytyy 'audio'-kansiosta.`);
                stopEverything();
            });

            currentAudio.onended = () => {
                updateUI(index, 'stopped');
                if (autoContinue && isPlayingList) {
                    const pauseSecs = parseFloat(document.getElementById('pauseTime').value) || 0;
                    if (index + 1 < tracks.length) {
                        document.getElementById(`status-${index + 1}`).innerText = `Tauko (${pauseSecs}s)...`;
                        timeoutId = setTimeout(() => {
                            playTrack(index + 1, true);
                        }, pauseSecs * 1000);
                    } else {
                        isPlayingList = false;
                        currentIndex = -1;
                    }
                } else {
                    currentIndex = -1;
                }
            };
        }

        function startPlaylist() {
            stopEverything();
            isPlayingList = true;
            playTrack(0, true);
        }

        function stopEverything() {
            isPlayingList = false;
            clearTimeout(timeoutId);
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (currentIndex !== -1) {
                updateUI(currentIndex, 'stopped');
            }
            currentIndex = -1;
        }

        function updateUI(activeIdx, state) {
            tracks.forEach((_, i) => {
                const item = document.getElementById(`track-${i}`);
                const status = document.getElementById(`status-${i}`);
                const icon = document.getElementById(`icon-${i}`);

                item.className = 'track-item';
                
                if (i === activeIdx) {
                    if (state === 'playing') {
                        item.classList.add('active');
                        status.innerText = 'Toistaa...';
                        icon.innerText = '⏸';
                    } else if (state === 'paused') {
                        item.classList.add('paused');
                        status.innerText = 'Pysäytetty (tauolla)';
                        icon.innerText = '▶';
                    } else {
                        status.innerText = 'Valmis';
                        icon.innerText = '▶';
                    }
                } else {
                    status.innerText = 'Valmis';
                    icon.innerText = '▶';
                }
            });
        }

        // Sanojen avaus ja sulku
        function openLyrics(index) {
            document.getElementById('modalTitle').innerText = tracks[index].title;
            document.getElementById('modalBody').innerText = tracks[index].lyrics || "Sanoituksia ei ole saatavilla.";
            document.getElementById('lyricsModal').style.display = 'flex';
        }

        function closeLyrics() {
            document.getElementById('lyricsModal').style.display = 'none';
        }

        // Sulje modaali klikkaamalla sen ulkopuolelle
        window.onclick = function(event) {
            const modal = document.getElementById('lyricsModal');
            if (event.target === modal) {
                closeLyrics();
            }
        }

        initPlaylist();
    </script>
</body>
</html>
